<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: sans-serif; width: 300px; padding: 12px; }
  input { width: 100%; padding: 6px; box-sizing: border-box; margin: 6px 0; }
  button { background: #e05d44; color: #fff; border: none; border-radius: 6px;
           padding: 7px 16px; cursor: pointer; }
  .dim { color: #888; font-size: 12px; line-height: 1.6; }
</style></head><body>
  <b>管理台服务器地址</b>
  <input id="server" placeholder="http://192.168.3.5:8791">
  <button id="save">保存</button> <span id="ok" style="color:#2e7d32"></span>
  <div class="dim">留空则自动尝试 127.0.0.1:8791 和 192.168.3.5:8791。<br>
  用法：打开拼多多商品页，点右下角「搬到管理台」按钮，然后去管理台「搬家上架」页确认发布。</div>
  <script src="popup.js"></script>
</body></html>
